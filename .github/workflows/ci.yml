on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

name: CI-Pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  name: CI-Pipeline
  NODE_OPTIONS: --max_old_space_size=7168

jobs:
  validate:
    name: Build & Test Package(s)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Enable Corepack
        run: corepack enable && corepack install
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install Packages
        run: pnpm install --frozen-lockfile
      - name: Build Applications
        run: pnpm build
      - name: Test Applications
        run: pnpm validate
      - name: Validate Documentation
        run: pnpm run docs
      - name: Publish Code Coverage Report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && success() && matrix.node-version == '24.x' }}
        with:
          slug: gradientedge/cdk-utils
          token: ${{ env.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && success() && matrix.node-version == '24.x' }}
        with:
          name: docs-artifact
          path: ./api-docs/
          # The artifact is only a hand-off to the docs deployment, so let it expire
          # on its own rather than deleting it with a third-party action.
          retention-days: 1

  release:
    name: Release Package(s)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && success() }}
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        node-version: [24.x]
    env:
      GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
      HUSKY: 0
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          # changesets/action v2 no longer writes an .npmrc from NPM_TOKEN, so the
          # registry auth has to be set up here instead. The generated .npmrc reads
          # NODE_AUTH_TOKEN, which is supplied on the publish step below.
          registry-url: 'https://registry.npmjs.org'
      - name: Enable Corepack
        run: corepack enable && corepack install
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install Packages
        run: pnpm install --frozen-lockfile
      - name: Build Production
        run: pnpm build:production
      - name: Create Release Pull Request or Publish
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          publish-script: pnpm release
          version-script: pnpm changeset version
          # Must match the GITHUB_TOKEN env var below: v2 refuses to run when both are
          # set to different values. The env var stays because
          # @changesets/changelog-github reads it while generating the changelog.
          github-token: ${{ secrets.GIT_TOKEN }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy-docs:
    name: Deploy Documentation
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && success() }}
    runs-on: ubuntu-latest
    needs: [release]
    # Pages deploys through its own OIDC flow, so this job needs no repository
    # token and the release job needs no Pages permission.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-artifact
          path: ./api-docs/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./api-docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

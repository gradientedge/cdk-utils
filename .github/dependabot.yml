# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      time: '09:00'
      timezone: 'Europe/London'
    allow:
      - dependency-type: 'direct'
    versioning-strategy: increase
    # Hold new releases for 7 days before proposing them. This is stricter than the
    # pnpm `minimumReleaseAge: 2880` (48h) gate in pnpm-workspace.yaml, so a PR
    # raised here is never one pnpm would refuse to install.
    cooldown:
      default-days: 7

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      time: '09:00'
      timezone: 'Europe/London'
    # Same 7 day window as the npm entry above. pnpm's `minimumReleaseAge` gate does
    # not reach GitHub Actions, so this cooldown is the only thing holding back a
    # freshly published action version here.
    cooldown:
      default-days: 7
